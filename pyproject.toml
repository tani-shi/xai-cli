[project]
name = "xai-cli"
version = "0.1.0"
description = "CLI tool for searching and browsing X (Twitter) content via xAI API"
readme = "README.md"
authors = [
    { name = "Shintaro Tanikawa", email = "shintaro.tanikawa@mooth.co.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "rich>=13",
    "pydantic>=2",
    "platformdirs>=4",
]

[project.scripts]
xai = "xai_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.35",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
